# The fungus's progression (P1, PRD §63.4; scripts/lab/progression.mjs) on GitHub's runners: one runner per seed, so 10-20
# seeds take about as long as the slowest one, and a container restart loses nothing (the same reason as assays.yml,
# ja-w7ef.12). Played offline on the local rule with the page's shipped fungus answers, one world, 600 + 600 ants:
# no Jev, no spend.
#
# Started by hand only (the Actions tab, or mcp__github__actions_run_trigger with method run_workflow, workflow_id
# progression.yml, ref the branch that has this file, and the inputs below). The CODE measured is the `ref` input (a
# branch, tag or commit; empty: the branch it was started on), so one run per arm compares two commits, e.g. main and a PR
# head, with the same workflow file and the same seeds. Compare by the worst seed, then confirm on seeds 11-20 (CLAUDE.md,
# PRD §42; P1's target is in docs/hyphal-growth.md §8: no seed more than 10 % slower to a quarter of the colony).
#
# The result is each seed's times to the first host, a quarter, a half and the queen, as a table in the `report` job's
# log and the run's summary (read it with get_job_logs); the per-seed text is the `progression-seed-<n>` artifact.
name: Progression

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The commit, branch or tag to measure (empty: the branch this was started on)"
        default: ""
      seeds:
        description: "Seeds: a range or list, e.g. 1-10 or 1-5,11 (at most 40: one runner each)"
        default: "1-10"
      seconds:
        description: "Game length in seconds"
        default: "600"
      aim:
        description: "The fungus's aim: unite, spread or peace"
        type: choice
        options: [unite, spread, peace]
        default: unite
      hyphae:
        description: "Grow the mycelium as hyphae (--hyphae)"
        type: boolean
        default: true
      growth:
        description: "Play the growth lane's shipped answers (--growth)"
        type: boolean
        default: false
      flow:
        description: "Mass flows along the hyphae (--flow)"
        type: boolean
        default: false
      bias:
        description: "The tips' traffic bias (--bias, PRD §88): default (the fungus's own: count), off, count or levels"
        type: choice
        options: [default, "off", count, levels] # "off" quoted: bare, YAML reads it as false and GitHub refuses the value
        default: default
      radius:
        description: "The bias's neighbourhood radius in cells (--radius); empty: the default (3)"
        default: ""
      tropism:
        description: "A growing tip leans toward ants on every this-many-th cell (--tropism; 0: never); empty: the default (4)"
        default: ""
      traffic:
        description: "Also sample the ants' occupancy round the hypha tips (--traffic; reads only, docs/hyphal-traffic.md)"
        type: boolean
        default: false
      order:
        description: "The upgrades the fungus keeps, in order, comma-separated (--order); empty: the script's default. Lichen: put `lichen` after the first `mycelium` (ja-vlla.11.3)"
        default: ""
      hungry:
        description: "The fungus is hungry (--hungry, FungusParams.hungry, PRD §93): a cheap spore, a landing reserve and the free pool's higher share"
        type: boolean
        default: false
      earnedshare:
        description: "The free pool's share of earned mass when hungry (--earned-share, PRD §93): lab override; only with hungry; empty: EARNED.share"
        default: ""
      sporecost:
        description: "The mass a spore costs (--spore-cost, ja-a2no): lab override of the not-hungry game; ignored with hungry (EARNED applies); empty: the game's 1"
        default: ""
      freebudget:
        description: "The most mass the free term pays out in a game (--free-budget, ja-a2no): lab override of the not-hungry game, a stand-in for a start reserve; ignored with hungry (EARNED applies); empty: no limit"
        default: ""
      ledger:
        description: "Also print each seed's energy ledger at 2, 5 and 10 minutes and the end: mass made by source and spent by sink, and what the mycelium holds (--ledger, ja-a2no.2; reads only)"
        type: boolean
        default: false
      split:
        description: "Report where each seed's growth was made: the mycelium on the ground, corpses and hosts (--split, PRD §85 M3)"
        type: boolean
        default: false
      nofoci:
        description: "Run the ungated game: flower patches form without the Foci upgrade (--no-foci, docs/foci.md, PRD §92). Default: gated, so none forms until Foci is kept; the default order ends `knots,foci` (arm C), an order without them forms no flower (arm E)"
        type: boolean
        default: false
      lichen:
        description: "Also probe the rock the hyphae lie beside and the late earning rate (--lichen; reads only, docs/lichen.md, ja-vlla.11.2)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seeds: ${{ steps.plan.outputs.seeds }}
      args: ${{ steps.plan.outputs.args }}
    steps:
      # The inputs reach the shell as environment variables, never spliced into the script, and each is checked
      # against a narrow pattern before it becomes an argument.
      - id: plan
        env:
          REF: ${{ inputs.ref }}
          SEEDS: ${{ inputs.seeds }}
          SECONDS_IN: ${{ inputs.seconds }}
          AIM: ${{ inputs.aim }}
          HYPHAE: ${{ inputs.hyphae }}
          GROWTH: ${{ inputs.growth }}
          FLOW: ${{ inputs.flow }}
          TRAFFIC: ${{ inputs.traffic }}
          LICHEN: ${{ inputs.lichen }}
          NOFOCI: ${{ inputs.nofoci }}
          ORDER: ${{ inputs.order }}
          SPLIT: ${{ inputs.split }}
          LEDGER: ${{ inputs.ledger }}
          SPORECOST: ${{ inputs.sporecost }}
          HUNGRY: ${{ inputs.hungry }}
          EARNEDSHARE: ${{ inputs.earnedshare }}
          FREEBUDGET: ${{ inputs.freebudget }}
          BIAS: ${{ inputs.bias }}
          RADIUS: ${{ inputs.radius }}
          TROPISM: ${{ inputs.tropism }}
        run: |
          set -f # no glob expansion of the inputs
          bad() { echo "::error title=progression input::$1"; exit 1; }
          [[ -z "$REF" || "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || bad "ref: a branch, tag or commit"
          [[ "$REF" == *..* ]] && bad "ref: no .."
          [[ "$SEEDS" =~ ^[0-9]+(-[0-9]+)?(,[0-9]+(-[0-9]+)?)*$ ]] || bad "seeds: e.g. 1-10 or 1-5,11"
          [[ "$SECONDS_IN" =~ ^[0-9]{1,4}$ ]] || bad "seconds: a whole number up to 9999 (a runner stops after 60 minutes)"
          [[ "$AIM" =~ ^(unite|spread|peace)$ ]] || bad "aim: unite, spread or peace"
          [[ "$BIAS" =~ ^(default|off|count|levels)$ ]] || bad "bias: default, off, count or levels"
          [[ -z "$ORDER" || "$ORDER" =~ ^[a-z]+(,[a-z]+)*$ ]] || bad "order: upgrade ids, comma-separated"
          [[ -z "$SPORECOST" || "$SPORECOST" =~ ^[0-9]+(\.[0-9]+)?$ ]] || bad "sporecost: empty or a number"
          [[ -z "$FREEBUDGET" || "$FREEBUDGET" =~ ^[0-9]+(\.[0-9]+)?$ ]] || bad "freebudget: empty or a number"
          [[ -z "$EARNEDSHARE" || "$EARNEDSHARE" =~ ^[0-9]+(\.[0-9]+)?$ ]] || bad "earnedshare: empty or a number"
          [[ -z "$RADIUS" || "$RADIUS" =~ ^[1-6]$ ]] || bad "radius: empty or 1 to 6"
          [[ -z "$TROPISM" || "$TROPISM" =~ ^[0-9]{1,2}$ ]] || bad "tropism: empty or 0 to 99"
          # --map one: the script's default was the side world, since removed (ja-fnd.3.4); a ref from before that needs it, a
          # later one ignores it.
          args="--map one --evolve --seconds $SECONDS_IN --aim $AIM"
          [ "$HYPHAE" = "true" ] && args="$args --hyphae"
          [ "$GROWTH" = "true" ] && args="$args --growth"
          [ "$FLOW" = "true" ] && args="$args --flow"
          [ "$TRAFFIC" = "true" ] && args="$args --traffic"
          [ "$LICHEN" = "true" ] && args="$args --lichen"
          [ "$NOFOCI" = "true" ] && args="$args --no-foci"
          [ "$BIAS" != "default" ] && args="$args --bias $BIAS"
          [ -n "$ORDER" ] && args="$args --order $ORDER"
          [ "$SPLIT" = "true" ] && args="$args --split"
          [ "$LEDGER" = "true" ] && args="$args --ledger"
          [ "$HUNGRY" = "true" ] && args="$args --hungry"
          [ -n "$EARNEDSHARE" ] && args="$args --earned-share $EARNEDSHARE"
          [ -n "$SPORECOST" ] && args="$args --spore-cost $SPORECOST"
          [ -n "$FREEBUDGET" ] && args="$args --free-budget $FREEBUDGET"
          [ -n "$RADIUS" ] && args="$args --radius $RADIUS"
          [ -n "$TROPISM" ] && args="$args --tropism $TROPISM"
          seeds=$(node -e '
            const s = process.argv[1].split(",").flatMap((p) => { const [a, b = a] = p.split("-").map(Number); return Array.from({ length: b - a + 1 }, (_, i) => a + i); });
            const u = [...new Set(s)];
            if (u.length === 0 || u.length > 40) { console.error(`${u.length} seeds: 1 to 40`); process.exit(1); }
            console.log(JSON.stringify(u));' "$SEEDS") || bad "seeds: 1 to 40 of them"
          echo "seeds=$seeds" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "progression.mjs $args, seeds $seeds, ref '${REF:-the started branch}'" >> "$GITHUB_STEP_SUMMARY"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # Checked in plan; word splitting turns them back into arguments.
      - name: seed ${{ matrix.seed }}
        env:
          ARGS: ${{ needs.plan.outputs.args }}
          SEED: ${{ matrix.seed }}
        run: |
          # No pipefail by default: without it a crashed progression.mjs would leave tee's exit status, and a green runner.
          set -o pipefail
          mkdir -p out
          echo "commit $(git rev-parse HEAD)" | tee "out/seed-$SEED.txt"
          # shellcheck disable=SC2086
          node scripts/lab/progression.mjs $ARGS --seeds "$SEED" | tee -a "out/seed-$SEED.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: progression-seed-${{ matrix.seed }}
          path: out/seed-${{ matrix.seed }}.txt
          retention-days: 7
          overwrite: true

  report:
    needs: [plan, run]
    # Not after a refused input: plan's ::error is the one to read.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
      - uses: actions/download-artifact@v8
        with:
          pattern: progression-seed-*
          path: out
          merge-multiple: true
      # The table: in this step's log (get_job_logs) and on the run's summary page. "never" counts as slower than any time.
      # A seed whose runner failed is missing from it, and the step says which.
      - name: table
        env:
          SEEDS: ${{ needs.plan.outputs.seeds }}
        run: |
          set -o pipefail # the table script's exit 1 (a seed with no result line) must not be tee's 0
          status=0
          node scripts/progression-table.mjs out | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          missing=$(node -e 'const fs = require("fs"); console.log(JSON.parse(process.argv[1]).filter((s) => !fs.existsSync(`out/seed-${s}.txt`)).join(" "))' "$SEEDS")
          if [ -n "$missing" ]; then echo "::error title=progression::no result for seeds $missing (their runners failed)"; exit 1; fi
          exit $status
      # --traffic's lines (one per seed and phase), in the log and on the summary page.
      - name: traffic
        run: |
          if grep -q '^  traffic ' out/seed-*.txt; then
            { echo; echo '```'; grep -H '^  traffic ' out/seed-*.txt | sed 's/^out\///'; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # --lichen's line (one per seed), in the log and on the summary page (ja-vlla.11.2).
      - name: lichen
        run: |
          if grep -q '^  lichen probe' out/seed-*.txt; then
            { echo; echo '```'; grep -H '^  lichen probe' out/seed-*.txt | sed 's/^out\///' | sort -V; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # The lichen each seed's fungus made (L1, ja-vlla.11.3): the seed's own line carries it once it holds any.
      - name: lichen made
        run: |
          if grep -q ' · lichen [0-9]* cells' out/seed-*.txt; then
            { echo; echo 'Seeds whose fungus made lichen:'; echo '```'; grep -h ' · lichen [0-9]* cells' out/seed-*.txt | sed -E 's/^(seed [0-9]+):.* · (lichen .*)$/\1: \2/' | sort -V; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'No seed made any lichen.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # --split's line (one per seed): where the growth that mutations come from was made.
      - name: growth split
        run: |
          if grep -q '^  growth made' out/seed-*.txt; then
            { echo; echo 'Growth made, by where (ground = the mycelium growing on its own, corpses = fed in, hosts = made in ants):'; echo '```'; grep -H '^  growth made' out/seed-*.txt | sed 's/^out\///' | sort -V; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # --ledger's lines (four a seed): the energy ledger (ja-a2no.2, docs/energy.md).
      - name: energy ledger
        run: |
          if grep -q '^  ledger @' out/seed-*.txt; then
            { echo; echo 'Energy ledger (mass made by source, spent by sink, and held):'; echo '```'; grep -H '^  ledger @' out/seed-*.txt | sed 's/^out\///' | sort -V; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
