# Every PR to main gets its own build on Pages, at
# https://<owner>.github.io/<repo>/pr-preview/pr-<number>/, with a sticky
# comment linking it; closing the PR removes it. Same Jev proxy as main
# (JEV_API_URL; the passphrase is per browser, so unlocking main unlocks the
# previews too: same origin). PRs from forks get no preview: they cannot push.
name: PR preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
        if: github.event.action != 'closed'
      - run: npm --prefix web run build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.pull_request.number }}/
          VITE_JEV_API: ${{ vars.JEV_API_URL }}
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: web/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
