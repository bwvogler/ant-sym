# The whole-game guards (web/src/colony/tests/slow): on runners up to about 13 minutes in 4 shards (the side view's side.test.ts,
# deleted in S2.3c, took 786 s in run 43722461875). --test-shard deals out whole files, so A11 and A12 have a file of their own (ja-jkc9). G1 (slow/g1/oneWorldG1.test.ts) runs its ten seeds in worker
# threads, one per core, so it has a job of its own: beside another file in a shard it ran out of the 20-minute limit
# (run 43722461875, ja-w7ef.15). It takes 11-14 minutes alone.
# - Nightly on main, and on demand from the Actions tab: a red run is a measurement to look at.
# - On a pull request that touches web/src/colony/ or web/shared/ and carries the `slow-guards` label (ja-w7ef.4): the
#   PR's author adds the label once the review approves (the steward skill), and the run then repeats on every push while
#   the label stays; the steward removes it after a pass. Its result arrives as the PR's `slow (n)` and `g1` checks, which wake a watching session like any other
#   check; a manual dispatch did not (2026-11-14). CLAUDE.md: run them before merging colony changes.
# The globs and limit are copies of web/package.json's test:slow (the shards' folder and g1's); ui/tests/ciShards.test.ts holds them equal.
name: Slow guards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      - "web/src/colony/**"
      - "web/shared/**"

permissions:
  contents: read

concurrency:
  # A labeled event for another label gets a group of its own: concurrency applies before the job's if:, so it would
  # otherwise cancel a running slow-guards run and then skip itself (review of #176, S1).
  group: slow-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'slow-guards' && format('-{0}', github.run_id) || '' }}
  # A new push to a labelled PR replaces its run; the nightly run is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  slow:
    # On a PR: only with the label, and for a `labeled` event only when that label is the one added.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'slow-guards') &&
       (github.event.action != 'labeled' || github.event.label.name == 'slow-guards'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # The reporter (scripts/ci-report.mjs, as in ci.yml): an ::error per failure after the spec totals, and per-file times.
      - name: slow guards, shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          TEST_REPORT_TITLE: slow guards, shard ${{ matrix.shard }}/${{ strategy.job-total }}
          TEST_DURATIONS_FILE: ${{ runner.temp }}/durations/slow-${{ matrix.shard }}.json
        run: mkdir -p "$RUNNER_TEMP/durations" && node --test --test-timeout=1200000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../scripts/ci-report.mjs --test-reporter-destination=stdout --test-shard=${{ matrix.shard }}/${{ strategy.job-total }} src/colony/tests/slow/*.test.ts
        working-directory: web
      - name: durations artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: slow-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations/
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true

  # G1 alone on a runner: its ten games take every core (see the header). Runs when the shards do.
  g1:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'slow-guards') &&
       (github.event.action != 'labeled' || github.event.label.name == 'slow-guards'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: G1, seeds 1-10
        env:
          TEST_REPORT_TITLE: G1, seeds 1-10
          TEST_DURATIONS_FILE: ${{ runner.temp }}/durations/g1.json
        run: mkdir -p "$RUNNER_TEMP/durations" && node --test --test-timeout=1200000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../scripts/ci-report.mjs --test-reporter-destination=stdout src/colony/tests/slow/g1/*.test.ts
        working-directory: web
      - name: durations artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: slow-durations-g1
          path: ${{ runner.temp }}/durations/
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true

  # Each unit and int file timed alone (--test-concurrency=1), against its tier's line in docs/agent-guide.md (Tests):
  # a ::warning names a file over it and the tier it belongs in (ja-w7ef.10). CI's shards run files side by side, so their
  # times overstate: fungus.test.ts took 16.4 s there and 8.6 s alone. Nightly and on demand only; it fails only if a test does.
  # The globs are copies of web/package.json's test:unit and test:int; ui/tests/ciShards.test.ts holds them equal.
  tiers:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: unit files alone
        env:
          TEST_REPORT_TITLE: unit files alone (line 1.5 s)
          TEST_TIER: unit:1500:int
          TEST_DURATIONS_FILE: ${{ runner.temp }}/durations/unit-alone.json
        run: mkdir -p "$RUNNER_TEMP/durations" && node --test --test-concurrency=1 --test-timeout=60000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../scripts/ci-report.mjs --test-reporter-destination=stdout server/tests/*.test.ts worker/tests/*.test.ts src/ui/tests/*.test.ts src/colony/tests/unit/*.test.ts
        working-directory: web
      - name: int files alone
        if: ${{ !cancelled() }}
        env:
          TEST_REPORT_TITLE: int files alone (line 12 s)
          TEST_TIER: int:12000:soak
          TEST_DURATIONS_FILE: ${{ runner.temp }}/durations/int-alone.json
        run: mkdir -p "$RUNNER_TEMP/durations" && node --test --test-concurrency=1 --test-timeout=60000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../scripts/ci-report.mjs --test-reporter-destination=stdout server/tests/int/*.test.ts worker/tests/int/*.test.ts src/ui/tests/int/*.test.ts src/colony/tests/int/*.test.ts
        working-directory: web
      - name: durations artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tier-durations
          path: ${{ runner.temp }}/durations/
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true
