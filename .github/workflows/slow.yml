# The whole-game guards (web/src/colony/tests/slow, about 5 minutes locally, longer on a runner):
# nightly, and on demand from the Actions tab. They never gate a PR or a deploy; a red run is a
# measurement to look at (CLAUDE.md: run them before merging colony changes).
name: Slow guards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run test:slow
