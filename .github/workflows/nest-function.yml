name: Nest function assay

on:
  pull_request:
    paths:
      - ".github/workflows/nest-function.yml"
      - "scripts/lab/nest-function.mjs"
      - "web/src/colony/passageTrace.ts"
      - "web/src/colony/dig.ts"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Simulated seconds for each variant"
        type: choice
        options: ["300", "600", "1200"]
        default: "600"

permissions:
  contents: read

concurrency:
  group: nest-function-${{ github.ref }}
  cancel-in-progress: true

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 17, 29, 43]
        mode: [current, trace, trace-repair]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18
      - name: Simulate world
        env:
          SEED: ${{ matrix.seed }}
          NEST_ASSAY_MODE: ${{ matrix.mode }}
          SECONDS_TO_PLAY: ${{ inputs.seconds || '600' }}
        run: node scripts/lab/nest-function.mjs "$SEED" "$SECONDS_TO_PLAY" > "nest-$SEED-$NEST_ASSAY_MODE.json"
      - uses: actions/upload-artifact@v7
        with:
          name: nest-function-seed-${{ matrix.seed }}-${{ matrix.mode }}
          path: nest-${{ matrix.seed }}-${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 30
  report:
    needs: world
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nest-function-seed-*
          path: out
          merge-multiple: true
      - name: Report final checkpoints
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          cols = ("Seed", "Mode", "Sim s", "Starting workers", "Food delivered", "Food held below",
                  "Peak held >30 s", "Reachable cells", "Chamber floor", "Floor fills", "Fill decisions / sites",
                  "Max tries at site", "Tick mean ms", "Tick p95 ms")
          print("| " + " | ".join(cols) + " |")
          print("| " + " | ".join(["---"] * len(cols)) + " |")
          populations = set()
          for seed in (7, 17, 29, 43):
              for mode in ("current", "trace", "trace-repair"):
                  report = json.loads(Path(f"out/nest-{seed}-{mode}.json").read_text())
                  assert report["seed"] == seed
                  populations.add(report["antsPerColony"])
                  [item] = report["results"]
                  assert item["mode"] == mode
                  point = item["checkpoints"][-1]
                  assert point["seconds"] == report["seconds"]
                  timing = item["tickTiming"]
                  row = (seed, mode, point["seconds"], report["antsPerColony"], point["foodDelivered"],
                         point["undergroundFoodCarriers"], point["peakUndergroundFoodHeldOver30s"],
                         point["reachableCells"], point["chamberFloor"], point["floorFills"],
                         f"{point['fillDecisions']} / {point['uniqueFillSites']}", point["maxDecisionsAtFillSite"],
                         f"{timing['meanMs']:.2f}", f"{timing['p95Ms']:.2f}")
                  print("| " + " | ".join(map(str, row)) + " |")
          assert len(populations) == 1
          print("\nPaired initial seeds. JSON artifacts include minute checkpoints. Tick times are from separate headless runners.")
          PY
