# Every pull request, and every branch push but main's (main's gate is pages.yml), runs the same
# checks the Pages build does before it deploys: lint, typecheck, and the fast tests. A failure
# shows on the PR instead of blocking the deploy afterwards (ja-6mj). test:slow is not run here.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
