# Every pull request runs the checks the Pages build does before it deploys (main's gate is
# pages.yml, which still runs the whole `npm test`): lint, typecheck and the quick tiers in one job,
# the long soak games sharded three ways beside it. A failure shows on the PR instead of blocking
# the deploy afterwards (ja-6mj). Only pull_request: a push trigger too would run each PR branch
# twice. test:slow is not here; it runs nightly (slow.yml).
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm --prefix web run test:unit
      - run: npm --prefix web run test:int
      - run: npm --prefix web run test:golden

  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # The flag goes before the files: node ignores --test-shard after them (so not `npm run test:soak -- ...`).
      # 120 s a file: the files of a shard run side by side on a small runner, and one was cancelled at 60 s (#78).
      - run: node --test --test-timeout=120000 --test-shard=${{ matrix.shard }}/3 src/colony/tests/soak/*.test.ts
        working-directory: web
