# Merges to main publish the static build to GitHub Pages, at the root of the
# gh-pages branch; PR previews live beside it under pr-preview/ (preview.yml).
# The API is dev-server middleware, so a Pages build talks to the hosted Jev
# proxy (web/worker, a Cloudflare Worker) when the repository variable
# JEV_API_URL names it, and is the Jev-less demo when it does not.
# Setup, once: docs/hosting.md (Pages source: Deploy from a branch, gh-pages, / (root)).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  worker:
    # Deploys the proxy with its secrets. Skipped until CLOUDFLARE_API_TOKEN is set.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22.18
      - name: Deploy web/worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: web/worker
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          ACCESS_PASSPHRASE: ${{ secrets.JEV_ANTS_PASSPHRASE }}
        run: |
          secrets="$RUNNER_TEMP/worker-secrets.json"
          node -e 'const s={}; for (const k of ["JEV_API_KEY","ACCESS_PASSPHRASE"]) if (process.env[k]) s[k]=process.env[k]; require("fs").writeFileSync(process.argv[1], JSON.stringify(s), {mode: 0o600})' "$secrets"
          npx --yes wrangler@4.151.3 deploy --secrets-file "$secrets"
          rm -f "$secrets"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm --prefix web run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_JEV_API: ${{ vars.JEV_API_URL }}
      - run: touch web/dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web/dist
          branch: gh-pages
          # Leave the PR previews alone, and don't overwrite a preview pushed meanwhile.
          clean-exclude: pr-preview/
          force: false
